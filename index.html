document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-display: swap;\n  src: url(\"6d6ac538-a912-4c66-873e-2fa92a7aec44\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b92c52e8-db9d-462c-bec9-2b369b4c7195\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2d92688c-ea89-4b45-9aa4-877c71b6681c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fd68c95e-120f-4ef8-97dd-49858e82471e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"f7c17fb1-6bfd-444c-9ade-b8f1c8c74d3c\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a3d77d5-5656-417e-8181-96ec6c3fc2c7\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a57b7e8e-2e28-4c99-9da4-3ee0e5486815\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"100d4c9e-e18a-43ee-9b54-e1310071581a\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6d6ac538-a912-4c66-873e-2fa92a7aec44\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b92c52e8-db9d-462c-bec9-2b369b4c7195\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2d92688c-ea89-4b45-9aa4-877c71b6681c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00 2-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2d92688c-ea89-4b45-9aa4-877c71b6681c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"fd68c95e-120f-4ef8-97dd-49858e82471e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); text-wrap: pretty; -webkit-font-smoothing: antialiased; }\n  a { color: var(--color-accent-300); text-decoration: none; }\n  a:hover { color: var(--color-accent-200); }\n  a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: radial-gradient(120% 60% at 12% 0%, #1e2135 0%, var(--color-bg) 62%); min-height: 100vh\">\n\n  <header style=\"display: flex; align-items: center; justify-content: space-between; gap: 22.4px; flex-wrap: wrap; padding: 16.8px max(22.4px, calc((100% - 1120px) / 2 + 22.4px)); background: linear-gradient(to right, var(--color-divider), var(--color-divider) 70%, transparent) bottom / 100% 1px no-repeat\">\n    <div style=\"display: flex; align-items: center; gap: 14px\">\n      <img src=\"5a73e9b5-d328-4e51-a9c1-30a06204baaf\" alt=\"Visual Effects Society\" class=\"lighten\" style=\"height: 38px; width: auto; display: block\">\n      <span style=\"width: 1px; height: 24px; background: var(--color-divider); display: block\"><\u002Fspan>\n      <span style=\"font-family: var(--font-heading); font-weight: 500; font-size: 14px; letter-spacing: 0.02em; color: var(--color-neutral-400)\">Technology Committee · AI<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display: flex; align-items: center; gap: 22.4px; font-size: 14px\">\n      <a href=\"#damicus\">Da-M-I-C-Us<\u002Fa>\n      <a href=\"#tools\">Tools<\u002Fa>\n      <a href=\"#webinars\">Webinars<\u002Fa>\n      <a href=\"https://docs.google.com/document/d/1UgIfWKZOpVCDFoNGQE-uYR9_gIEDzRESEkAuGw0gh0k/edit?tab=t.hxcmncevec8l\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\">The draft standard<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 89.6px 22.4px 56px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 56px; align-items: start\">\n    <div>\n      <span class=\"tag tag-outline\" style=\"display: inline-block; margin-bottom: 22.4px\">Generative AI working group<\u002Fspan>\n      <h1 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(42px, 5.4vw, 76px); line-height: 1.04; letter-spacing: -0.02em; margin: 0\">\n        <span style=\"display: block\">A common way to<\u002Fspan>\n        <span style=\"display: block\">describe an AI tool<\u002Fspan>\n        <span style=\"display: block; color: var(--color-accent)\">on a show.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 1.6; max-width: 58ch; margin: 22.4px 0 0; color: var(--color-neutral-300)\">\n        <b style=\"font-weight: 500; color: var(--color-text)\">Da-M-I-C-Us<\u002Fb> is a classification scheme from the VES Technology\n        Committee’s generative AI work: five dimensions — Data, Model, Infrastructure,\n        Code and Use — that let a studio, a vendor and a client say precisely what an AI\n        deployment <i>is<\u002Fi> before anyone argues about whether it is allowed. The factual\n        classification stays separate from the policy that judges it.\n      <\u002Fp>\n      <div style=\"display: flex; gap: 11.2px; flex-wrap: wrap; margin-top: 22.4px\">\n        <a href=\"one-page/Da-M-I-C-Us Summary (standalone).html\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\">One-page reference sheet<\u002Fa>\n        <a href=\"https://docs.google.com/document/d/1UgIfWKZOpVCDFoNGQE-uYR9_gIEDzRESEkAuGw0gh0k/edit?tab=t.hxcmncevec8l\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-ghost\">Read the full document<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 1.5; color: var(--color-neutral-500); margin: 16.8px 0 0\">\n        Da-M-I-C-Us v1.0, draft 2 · working material, not a ratified VES standard.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <figure class=\"card elev-md\" style=\"margin: 0; padding: 0; overflow: hidden\">\n      <figcaption style=\"padding: 11.2px 16.8px; background: linear-gradient(to right, var(--color-divider), var(--color-divider) 80%, transparent) bottom / 100% 1px no-repeat; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-400); display: flex; justify-content: space-between; gap: 11.2px; flex-wrap: wrap\">\n        <span>Worked example<\u002Fspan>\n        <span style=\"color: var(--color-accent-300)\">WD-OM-SI-OC-unset<\u002Fspan>\n      <\u002Ffigcaption>\n      <div style=\"display: grid; gap: 0\">\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11.2px 16.8px\">\n          <img src=\"87cce7d4-7044-44d4-b91f-28cc5859918c\" alt=\"\" style=\"width: 44px; height: 44px; display: block; border-radius: var(--radius-sm)\">\n          <span><b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 17px; display: block; letter-spacing: -0.01em\">WD · Web-collected data<\u002Fb><span style=\"font-size: 13.5px; color: var(--color-neutral-500)\">Rights not individually cleared<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider)\">\n          <img src=\"d4614a96-670e-41f6-9d75-8638810b14e3\" alt=\"\" style=\"width: 44px; height: 44px; display: block; border-radius: var(--radius-sm)\">\n          <span><b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 17px; display: block; letter-spacing: -0.01em\">OM · Open model<\u002Fb><span style=\"font-size: 13.5px; color: var(--color-neutral-500)\">Permissively licensed weights<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider)\">\n          <img src=\"bf0abb14-5aca-4a5b-b52f-6670d743a824\" alt=\"\" style=\"width: 44px; height: 44px; display: block; border-radius: var(--radius-sm)\">\n          <span><b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 17px; display: block; letter-spacing: -0.01em\">SI · Self-managed<\u002Fb><span style=\"font-size: 13.5px; color: var(--color-neutral-500)\">Inference on your own machines<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider)\">\n          <img src=\"db42ab04-cbda-4bd6-8be1-535700fac53d\" alt=\"\" style=\"width: 44px; height: 44px; display: block; border-radius: var(--radius-sm)\">\n          <span><b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 17px; display: block; letter-spacing: -0.01em\">OC · Open code<\u002Fb><span style=\"font-size: 13.5px; color: var(--color-neutral-500)\">Surrounding software is open<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider)\">\n          <img src=\"d6a0a0d1-7d8b-4449-9581-1590504ee76b\" alt=\"\" style=\"width: 44px; height: 44px; display: block; border-radius: var(--radius-sm); opacity: 0.65\">\n          <span><b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 17px; display: block; letter-spacing: -0.01em; color: var(--color-neutral-500)\">Use · unset<\u002Fb><span style=\"font-size: 13.5px; color: var(--color-neutral-500)\">A capability class — no verdict attaches<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section id=\"damicus\" style=\"max-width: 1120px; margin: 0 auto; padding: 22.4px 22.4px 56px\">\n    <div style=\"display: flex; align-items: baseline; gap: 16.8px; flex-wrap: wrap; margin-bottom: 22.4px\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(28px, 3vw, 40px); line-height: 1.1; letter-spacing: -0.02em; margin: 0\">The five dimensions<\u002Fh2>\n      <span style=\"font-size: 13px; color: var(--color-neutral-500)\">5 axes · 22 codes · v1.0 draft 2<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height: 1px; background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); margin-bottom: 22.4px\"><\u002Fdiv>\n\n    <div class=\"card\" style=\"padding: 0; overflow: hidden\">\n      <sc-raw-table class=\"table\" style=\"table-layout: fixed; margin: 0\">\n        <sc-raw-thead>\n          <sc-raw-tr>\n            <sc-raw-th style=\"width: 68px\"><\u002Fsc-raw-th>\n            <sc-raw-th style=\"width: 22%\">Dimension<\u002Fsc-raw-th>\n            <sc-raw-th style=\"width: 16%\">Codes<\u002Fsc-raw-th>\n            <sc-raw-th>The question it answers<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr>\n            <sc-raw-td><img src=\"738a9ff9-76d3-4eff-b930-0e1e1d3a1e9f\" alt=\"\" style=\"width: 36px; height: 36px; display: block; border-radius: var(--radius-sm)\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-family: var(--font-heading); font-weight: 500; font-size: 18px; letter-spacing: -0.01em\">Data <span style=\"color: var(--color-neutral-500)\">(Da)<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 13px; letter-spacing: 0.04em; color: var(--color-accent-300)\">PD LD ND WD UD<\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 14.5px; color: var(--color-neutral-300)\">What was the model trained on, and are those rights cleared for this use?<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td><img src=\"d4614a96-670e-41f6-9d75-8638810b14e3\" alt=\"\" style=\"width: 36px; height: 36px; display: block; border-radius: var(--radius-sm)\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-family: var(--font-heading); font-weight: 500; font-size: 18px; letter-spacing: -0.01em\">Model <span style=\"color: var(--color-neutral-500)\">(M)<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 13px; letter-spacing: 0.04em; color: var(--color-accent-300)\">PM OM CM RM<\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 14.5px; color: var(--color-neutral-300)\">Who owns or licenses the weights, and on what terms are they available?<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td><img src=\"bf0abb14-5aca-4a5b-b52f-6670d743a824\" alt=\"\" style=\"width: 36px; height: 36px; display: block; border-radius: var(--radius-sm)\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-family: var(--font-heading); font-weight: 500; font-size: 18px; letter-spacing: -0.01em\">Infrastructure <span style=\"color: var(--color-neutral-500)\">(I)<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 13px; letter-spacing: 0.04em; color: var(--color-accent-300)\">SI EI DI MI<\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 14.5px; color: var(--color-neutral-300)\">Where does inference run — your machines, the edge, or someone else’s service?<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td><img src=\"db42ab04-cbda-4bd6-8be1-535700fac53d\" alt=\"\" style=\"width: 36px; height: 36px; display: block; border-radius: var(--radius-sm)\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-family: var(--font-heading); font-weight: 500; font-size: 18px; letter-spacing: -0.01em\">Code <span style=\"color: var(--color-neutral-500)\">(C)<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 13px; letter-spacing: 0.04em; color: var(--color-accent-300)\">PC OC CC RC UC<\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 14.5px; color: var(--color-neutral-300)\">What is the licence status of the surrounding software and pipeline?<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td><img src=\"b657e2b7-fd99-4c50-ae1e-34a4274439ec\" alt=\"\" style=\"width: 36px; height: 36px; display: block; border-radius: var(--radius-sm)\"><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-family: var(--font-heading); font-weight: 500; font-size: 18px; letter-spacing: -0.01em\">Use <span style=\"color: var(--color-neutral-500)\">(Us)<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 13px; letter-spacing: 0.04em; color: var(--color-accent-300)\">BU PU IU DU<\u002Fsc-raw-td>\n            <sc-raw-td style=\"font-size: 14.5px; color: var(--color-neutral-300)\">What is it actually being used for on this show? Leave it unset and you have a capability class, not a deployment.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <p style=\"margin: 0; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider); font-size: 13px; line-height: 1.6; color: var(--color-neutral-500)\">\n        A verdict attaches to the full five-code string, never to a single code. Four-part strings\n        (Use left unset) describe a capability; the fifth part makes it a deployment that policy can judge.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showTools }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"tools\" style=\"max-width: 1120px; margin: 0 auto; padding: 22.4px 22.4px 56px\">\n    <h2 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(28px, 3vw, 40px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 22.4px\">Prototype tools<\u002Fh2>\n    <div style=\"height: 1px; background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); margin-bottom: 22.4px\"><\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16.8px\">\n      <a class=\"card\" href=\"classifier/damicus-v2_classifier_r4.html\" target=\"_blank\" rel=\"noopener\" style=\"display: block; color: inherit; text-decoration: none; transition: box-shadow 140ms, background 140ms\" style-hover=\"background: var(--color-accent-900); box-shadow: 0 0 0 1px var(--color-accent-600), 0 6px 18px rgba(0,0,0,0.55)\">\n        <span class=\"card-kicker\">Guided · r4<\u002Fspan>\n        <h3 class=\"card-title\" style=\"font-size: 21px\">Classifier<\u002Fh3>\n        <p class=\"card-body\">Answer the questions and the five-code string builds as you go, with a printable classification card at the end.<\u002Fp>\n      <\u002Fa>\n      <a class=\"card\" href=\"Da-M-I-C-Us/classifier/damicus-v2_policymaker_r9.html\" target=\"_blank\" rel=\"noopener\" style=\"display: block; color: inherit; text-decoration: none; transition: box-shadow 140ms, background 140ms\" style-hover=\"background: var(--color-accent-900); box-shadow: 0 0 0 1px var(--color-accent-600), 0 6px 18px rgba(0,0,0,0.55)\">\n        <span class=\"card-kicker\">Normative · r9<\u002Fspan>\n        <h3 class=\"card-title\" style=\"font-size: 21px\">Policy Maker<\u002Fh3>\n        <p class=\"card-body\">Build an organisation’s rule list — permitted, by approval, refused — and export it as JSON the other tools can read.<\u002Fp>\n      <\u002Fa>\n      <a class=\"card\" href=\"classifier/index.html\" target=\"_blank\" rel=\"noopener\" style=\"display: block; color: inherit; text-decoration: none; transition: box-shadow 140ms, background 140ms\" style-hover=\"background: var(--color-accent-900); box-shadow: 0 0 0 1px var(--color-accent-600), 0 6px 18px rgba(0,0,0,0.55)\">\n        <span class=\"card-kicker\">Exploration shell<\u002Fspan>\n        <h3 class=\"card-title\" style=\"font-size: 21px\">Compare<\u002Fh3>\n        <p class=\"card-body\">What it is on the left, what the organisation permits on the right, and the verdict in the circle between them.<\u002Fp>\n      <\u002Fa>\n    <\u002Fdiv>\n    <p style=\"font-size: 13px; line-height: 1.6; color: var(--color-neutral-500); margin: 16.8px 0 0\">\n      Prototypes from the working group, offline single files. Verdicts shown use draft 2’s illustrative internal policy; an organisation substitutes its own.\n    <\u002Fp>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showWebinars }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"webinars\" style=\"background: radial-gradient(90% 120% at 8% 0%, var(--color-section-glow) 0%, var(--color-section) 58%); color: var(--color-neutral-100); padding: 67.2px 0; margin-top: 22.4px\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 0 22.4px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 44.8px; align-items: start\">\n      <div>\n        <span style=\"display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-300); margin-bottom: 11.2px\">GenAI webinars<\u002Fspan>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(28px, 3vw, 40px); line-height: 1.08; letter-spacing: -0.02em; margin: 0\">Where the thinking came from<\u002Fh2>\n        <p style=\"font-size: 15.5px; line-height: 1.6; margin: 16.8px 0 0; color: var(--color-accent-200)\">\n          The classification work follows a run of public sessions on what generative AI\n          is actually doing inside visual effects — in artists’ hands, in the\n          software, and in the contracts around both.\n        <\u002Fp>\n        <div style=\"display: flex; gap: 11.2px; flex-wrap: wrap; margin-top: 22.4px\">\n          <a href=\"https://www.vesglobal.org/gen-ai-resources-page/\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"border-color: var(--color-accent-300); color: var(--color-accent-100)\">GenAI resources page<\u002Fa>\n          <a href=\"https://vesglobal.org/technology-committee-activities/\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-ghost\" style=\"color: var(--color-accent-200)\">Committee activities<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; gap: 0\">\n        <li style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16.8px; padding: 16.8px 0; border-top: 1px solid color-mix(in srgb, var(--color-neutral-100) 22%, transparent)\">\n          <span style=\"font-family: var(--font-heading); font-weight: 500; font-size: 20px; color: var(--color-accent-300)\">01<\u002Fspan>\n          <span>\n            <a href=\"https://www.vesglobal.org/gen-ai-resources-page/\" target=\"_blank\" rel=\"noopener\" style=\"font-family: var(--font-heading); font-weight: 500; font-size: 21px; line-height: 1.2; letter-spacing: -0.015em; color: var(--color-neutral-100); display: block\">Real Applications of Generative Artificial Intelligence in Visual Effects<\u002Fa>\n            <span style=\"display: block; font-size: 13.5px; line-height: 1.5; margin-top: 5.6px; color: var(--color-accent-200)\">What is in production today, shown by the people running it.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fli>\n        <li style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16.8px; padding: 16.8px 0; border-top: 1px solid color-mix(in srgb, var(--color-neutral-100) 22%, transparent)\">\n          <span style=\"font-family: var(--font-heading); font-weight: 500; font-size: 20px; color: var(--color-accent-300)\">02<\u002Fspan>\n          <span>\n            <a href=\"https://www.vesglobal.org/gen-ai-resources-page/\" target=\"_blank\" rel=\"noopener\" style=\"font-family: var(--font-heading); font-weight: 500; font-size: 21px; line-height: 1.2; letter-spacing: -0.015em; color: var(--color-neutral-100); display: block\">Generative Artificial Intelligence in VFX Software: Now and In the Future<\u002Fa>\n            <span style=\"display: block; font-size: 13.5px; line-height: 1.5; margin-top: 5.6px; color: var(--color-accent-200)\">How the tool vendors are building it into the pipeline.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fli>\n        <li style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16.8px; padding: 16.8px 0; border-top: 1px solid color-mix(in srgb, var(--color-neutral-100) 22%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--color-neutral-100) 22%, transparent)\">\n          <span style=\"font-family: var(--font-heading); font-weight: 500; font-size: 20px; color: var(--color-accent-300)\">03<\u002Fspan>\n          <span>\n            <a href=\"https://www.vesglobal.org/gen-ai-resources-page/\" target=\"_blank\" rel=\"noopener\" style=\"font-family: var(--font-heading); font-weight: 500; font-size: 21px; line-height: 1.2; letter-spacing: -0.015em; color: var(--color-neutral-100); display: block\">How Generative Artificial Intelligence Might Affect Visual Effects Now and In the Future<\u002Fa>\n            <span style=\"display: block; font-size: 13.5px; line-height: 1.5; margin-top: 5.6px; color: var(--color-accent-200)\">The longer view: craft, employment and the shape of the work.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"max-width: 1120px; margin: 0 auto; padding: 67.2px 22.4px\">\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44.8px; align-items: center\">\n      <div>\n        <h2 style=\"font-family: var(--font-heading); font-weight: 500; font-size: clamp(28px, 3vw, 40px); line-height: 1.08; letter-spacing: -0.02em; margin: 0\">Two documents, one scheme<\u002Fh2>\n        <p style=\"font-size: 15.5px; line-height: 1.6; max-width: 52ch; margin: 16.8px 0 0; color: var(--color-neutral-300)\">\n          Start with the one-page sheet if you need to classify something this afternoon.\n          Go to the full document for the definitions, the matching rules and the worked\n          examples — and to leave comments for the working group.\n        <\u002Fp>\n        <div style=\"display: flex; gap: 11.2px; flex-wrap: wrap; margin-top: 22.4px\">\n          <a href=\"one-page/Da-M-I-C-Us Summary (standalone).html\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\">One-page sheet<\u002Fa>\n          <a href=\"https://docs.google.com/document/d/1UgIfWKZOpVCDFoNGQE-uYR9_gIEDzRESEkAuGw0gh0k/edit?tab=t.hxcmncevec8l\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-ghost\">Full document (Google Docs)<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure class=\"card elev-md\" style=\"margin: 0; padding: 0; overflow: hidden\">\n        <figcaption style=\"padding: 11.2px 16.8px; border-bottom: 1px solid var(--color-divider); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-400); display: flex; justify-content: space-between; gap: 11.2px; flex-wrap: wrap\">\n          <span>Contrast case<\u002Fspan>\n          <span style=\"color: var(--color-accent-300)\">PD-PM-SI-PC-unset<\u002Fspan>\n        <\u002Ffigcaption>\n        <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0\">\n          <div style=\"padding: 16.8px 11.2px; text-align: center; display: grid; gap: 8.4px; justify-items: center\">\n            <img src=\"738a9ff9-76d3-4eff-b930-0e1e1d3a1e9f\" alt=\"\" style=\"width: 46px; height: 46px; display: block; border-radius: var(--radius-sm)\">\n            <b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 16px\">PD<\u002Fb>\n            <span style=\"font-size: 12.5px; line-height: 1.4; color: var(--color-neutral-500)\">Owned data<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 16.8px 11.2px; text-align: center; display: grid; gap: 8.4px; justify-items: center; border-left: 1px solid var(--color-divider)\">\n            <img src=\"50971899-ed1d-4a03-b46d-8d3bde05ad22\" alt=\"\" style=\"width: 46px; height: 46px; display: block; border-radius: var(--radius-sm)\">\n            <b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 16px\">PM<\u002Fb>\n            <span style=\"font-size: 12.5px; line-height: 1.4; color: var(--color-neutral-500)\">Owned weights<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 16.8px 11.2px; text-align: center; display: grid; gap: 8.4px; justify-items: center; border-left: 1px solid var(--color-divider)\">\n            <img src=\"bf0abb14-5aca-4a5b-b52f-6670d743a824\" alt=\"\" style=\"width: 46px; height: 46px; display: block; border-radius: var(--radius-sm)\">\n            <b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 16px\">SI<\u002Fb>\n            <span style=\"font-size: 12.5px; line-height: 1.4; color: var(--color-neutral-500)\">Self-managed<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 16.8px 11.2px; text-align: center; display: grid; gap: 8.4px; justify-items: center; border-left: 1px solid var(--color-divider)\">\n            <img src=\"693da503-e050-443e-bc6b-981e2e0199f5\" alt=\"\" style=\"width: 46px; height: 46px; display: block; border-radius: var(--radius-sm)\">\n            <b style=\"font-family: var(--font-heading); font-weight: 500; font-size: 16px\">PC<\u002Fb>\n            <span style=\"font-size: 12.5px; line-height: 1.4; color: var(--color-neutral-500)\">Proprietary code<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; padding: 11.2px 16.8px; border-top: 1px solid var(--color-divider); font-size: 13px; line-height: 1.6; color: var(--color-neutral-500)\">\n          An in-house model on owned data — the same notation, a very different conversation.\n        <\u002Fp>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: linear-gradient(to right, var(--color-divider), var(--color-divider) 70%, transparent) top / 100% 1px no-repeat\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 22.4px; display: flex; align-items: center; justify-content: space-between; gap: 22.4px; flex-wrap: wrap\">\n      <div style=\"display: flex; align-items: center; gap: 11.2px\">\n        <img src=\"5a73e9b5-d328-4e51-a9c1-30a06204baaf\" alt=\"Visual Effects Society\" class=\"lighten\" style=\"height: 26px; width: auto; display: block; opacity: 0.7\">\n        <span style=\"font-size: 13px; color: var(--color-neutral-500)\">VES Technology Committee · Generative AI Working Group<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 16.8px; flex-wrap: wrap; font-size: 13px\">\n        <a href=\"https://vesglobal.org/technology-committee-activities/\" target=\"_blank\" rel=\"noopener\">Committee activities<\u002Fa>\n        <a href=\"https://www.vesglobal.org/gen-ai-resources-page/\" target=\"_blank\" rel=\"noopener\">GenAI resources<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTools&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showWebinars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showTools: this.props.showTools ?? true,\n      showWebinars: this.props.showWebinars ?? true,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
